[package]
name = "ducktape-provider"
description = "One normalized interface over model vendors: the Rust API of ducktape-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "ducktape_provider"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[dependencies]
ducktape-core = { path = "../core" }
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
tokio.workspace = true
futures-core.workspace = true
getrandom.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
ducktape-conformance = { path = "../conformance" }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
base64.workspace = true
