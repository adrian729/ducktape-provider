name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p ducktape-abi

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema referencing
      - run: python scripts/check_fixtures.py .
      - run: python scripts/gen_dts.py . --check
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: python scripts/gen_go_types.py . --check
      - run: python scripts/gen_java_types.py . --check
      - run: python scripts/gen_cs_types.py . --check

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin httpx pytest
      - run: maturin develop
        working-directory: bindings/python
      - run: python -m pytest -q
        working-directory: bindings/python

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: bindings/js
      - run: npm run check:types
        working-directory: bindings/js
      - run: npm run build:wasm
        working-directory: bindings/js
      - run: npm test
        working-directory: bindings/js
      - run: npm run test:browser
        working-directory: bindings/js

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bindings/go/go.sum
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p ducktape-abi
      - run: cp target/wasm32-unknown-unknown/wasm/ducktape_abi.wasm bindings/go/core.wasm
      - run: go vet ./...
        working-directory: bindings/go
      - run: go test ./...
        working-directory: bindings/go

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p ducktape-abi
      - run: cp target/wasm32-unknown-unknown/wasm/ducktape_abi.wasm bindings/java/core.wasm
      - run: mvn -B verify
        working-directory: bindings/java

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: cargo build --release -p ducktape-abi
      - run: mkdir -p bindings/dotnet/runtimes/linux-x64/native && cp target/release/libducktape_abi.so bindings/dotnet/runtimes/linux-x64/native/
      - run: dotnet test
        working-directory: bindings/dotnet
      - run: dotnet pack Ducktape.Provider -c Release -o ../../dist/dotnet
        working-directory: bindings/dotnet

  c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      - run: cargo build --release -p ducktape-abi
      - run: cbindgen --config crates/abi/cbindgen.toml --crate ducktape-abi --output /tmp/ducktape.h && diff -u bindings/c/include/ducktape.h /tmp/ducktape.h
      - run: cmake -S bindings/c -B build/c -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
      - run: cmake --build build/c
      - run: ctest --test-dir build/c --output-on-failure
      - run: cmake --install build/c --prefix /tmp/ducktape-prefix
