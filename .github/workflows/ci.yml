name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Ruff and ty both target requires-python's minimum, so one run covers every supported version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.10" # matches pyproject's uv_build pin (>=0.12.10,<0.13.0)
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Install ty
        # Not a dev dependency, so it stays out of uv.lock; installed into the synced venv
        # from a hash-pinned file because uvx doesn't verify hashes.
        run: uv pip install --require-hashes -r .github/ty-requirements.txt

      - name: Type check
        # `python -m` so a missing venv install fails instead of falling back to some other ty on PATH.
        run: uv run python -m ty check src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.10" # matches pyproject's uv_build pin (>=0.12.10,<0.13.0)
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        # Surfaces unclosed sockets/responses that would otherwise be silently ignored.
        run: uv run python -W default -W error::ResourceWarning -m unittest discover -s tests
